    <text x="500" y="340" fill="#cbd5e1" font-size="32" font-family="Segoe UI, Arial, sans-serif">AI Assistant</text>
    <rect x="500" y="380" width="250" height="8" rx="4" fill="url(#accent)"/>
    <text x="500" y="450" fill="#94a3b8" font-size="24" font-family="Segoe UI, Arial, sans-serif">Voice • Vision • Memory • Automation</text>
